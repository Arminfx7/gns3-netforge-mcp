<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">GNS3 NetForge MCP</title>
  <desc id="desc">MCP conectado a una topología GNS3 con routers, switches y hosts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#123c56"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="70" r="180" fill="#00aEEF" opacity=".08"/>
  <circle cx="180" cy="370" r="220" fill="#6e56cf" opacity=".10"/>
  <g stroke="#55d6be" stroke-width="4" opacity=".75" fill="none">
    <path d="M185 245 L350 165 L540 245 L735 145 L950 230"/>
    <path d="M350 165 L350 310 L540 245 L735 320 L950 230"/>
  </g>
  <g fill="#55d6be" stroke="#d7fff7" stroke-width="3">
    <circle cx="185" cy="245" r="8"/><circle cx="350" cy="165" r="8"/>
    <circle cx="540" cy="245" r="8"/><circle cx="735" cy="145" r="8"/>
    <circle cx="950" cy="230" r="8"/><circle cx="350" cy="310" r="8"/>
    <circle cx="735" cy="320" r="8"/>
  </g>
  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="62" y="205" width="150" height="78" rx="16" fill="#e8f5e9"/>
    <text x="137" y="238" font-size="17" font-weight="700" fill="#173b2a">Cliente MCP</text>
    <text x="137" y="262" font-size="13" fill="#2d6044">Claude · Codex</text>
    <rect x="272" y="113" width="156" height="104" rx="18" fill="#6e56cf"/>
    <text x="350" y="157" font-size="22" font-weight="700" fill="white">MCP</text>
    <text x="350" y="182" font-size="13" fill="#eeeaff">Tools · Resources</text>
    <rect x="462" y="195" width="156" height="100" rx="18" fill="#00aEEF"/>
    <text x="540" y="238" font-size="22" font-weight="700" fill="white">GNS3</text>
    <text x="540" y="263" font-size="13" fill="#e5f8ff">API · Consolas</text>
    <rect x="657" y="93" width="156" height="104" rx="18" fill="#f59e0b"/>
    <text x="735" y="137" font-size="21" font-weight="700" fill="#3f2500">Router</text>
    <text x="735" y="162" font-size="13" fill="#5f3b00">OSPF · RIP · EIGRP</text>
    <rect x="872" y="191" width="156" height="78" rx="16" fill="#94a3b8"/>
    <text x="950" y="224" font-size="19" font-weight="700" fill="#172033">Switch + PCs</text>
    <text x="950" y="247" font-size="13" fill="#26354b">Topologías de red</text>
  </g>
  <text x="600" y="62" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" text-anchor="middle">GNS3 NetForge MCP</text>
  <text x="600" y="388" fill="#b8d9e6" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">Automatización de laboratorios GNS3 mediante Model Context Protocol</text>
</svg>
